<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dart Scorer - Camera Feed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100vw;
        }
        
        .header {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .title {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ef4444, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-indicators {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 0.5rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.active {
            background: #10b981;
        }
        
        .status-dot.inactive {
            background: #ef4444;
        }
        
        .camera-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 1rem;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
            height: auto;
            aspect-ratio: 4/3;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .dartboard-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            opacity: 0.3;
        }
        
        .dartboard-overlay svg {
            width: 100%;
            height: 100%;
        }
        
        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
        
        .btn-secondary {
            background: rgba(51, 65, 85, 0.8);
            color: white;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
        }
        
        .detection-info {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            min-width: 200px;
        }
        
        .detection-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .detection-info .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(148, 163, 184, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="title">
                <span>🎯</span>
                AI Dart Scorer - Camera Feed
            </div>
            <div class="status-indicators">
                <div class="status-item">
                    <div class="status-dot active" id="cameraStatus"></div>
                    <span>Camera</span>
                </div>
                <div class="status-item">
                    <div class="status-dot inactive" id="detectionStatus"></div>
                    <span>Detection</span>
                </div>
                <div class="status-item">
                    <span id="fpsCounter">0 FPS</span>
                </div>
            </div>
        </header>
        
        <div class="camera-container">
            <div class="video-wrapper">
                <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Camera Feed" onerror="handleImageError()">
                
                <div class="dartboard-overlay">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <!-- Dartboard circles -->
                        <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="35" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="20" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="15" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="10" fill="none" stroke="white" stroke-width="0.5" opacity="0.6"/>
                        <circle cx="50" cy="50" r="5" fill="red" opacity="0.8"/>
                        
                        <!-- Dartboard segments -->
                        <g stroke="white" stroke-width="0.3" opacity="0.4">
                            <line x1="50" y1="5" x2="50" y2="95"/>
                            <line x1="5" y1="50" x2="95" y2="50"/>
                            <line x1="15.9" y1="15.9" x2="84.1" y2="84.1"/>
                            <line x1="84.1" y1="15.9" x2="15.9" y2="84.1"/>
                        </g>
                    </svg>
                </div>
                
                <div class="loading" id="loadingIndicator" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>Initializing camera...</p>
                </div>
            </div>
            
            <div class="detection-info">
                <h3>Darts Detected</h3>
                <div class="value" id="dartCount">0</div>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="captureFrame()">
                    <span>📸</span>
                    Capture Frame
                </button>
                <button class="btn btn-secondary" onclick="toggleDetection()">
                    <span>🎯</span>
                    <span id="detectionButtonText">Start Detection</span>
                </button>
                <button class="btn btn-secondary" onclick="refreshFeed()">
                    <span>🔄</span>
                    Refresh
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let isDetecting = false;
        let detectionInterval;
        let frameCount = 0;
        let lastFrameTime = Date.now();
        
        // FPS Counter
        function updateFPS() {
            frameCount++;
            const now = Date.now();
            if (now - lastFrameTime >= 1000) {
                document.getElementById('fpsCounter').textContent = frameCount + ' FPS';
                frameCount = 0;
                lastFrameTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
        updateFPS();
        
        function handleImageError() {
            console.error('Failed to load camera feed');
            document.getElementById('cameraStatus').className = 'status-dot inactive';
            document.getElementById('loadingIndicator').style.display = 'block';
        }
        
        function captureFrame() {
            fetch('/api/camera/capture', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filename: `dart_capture_${Date.now()}.jpg`,
                    saveToDataset: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`Image captured: ${data.filename}`);
                } else {
                    alert('Failed to capture image');
                }
            })
            .catch(error => {
                console.error('Error capturing frame:', error);
                alert('Error capturing frame');
            });
        }
        
        function toggleDetection() {
            const button = document.getElementById('detectionButtonText');
            const statusDot = document.getElementById('detectionStatus');
            
            if (isDetecting) {
                clearInterval(detectionInterval);
                isDetecting = false;
                button.textContent = 'Start Detection';
                statusDot.className = 'status-dot inactive';
            } else {
                // Start detection
                isDetecting = true;
                button.textContent = 'Stop Detection';
                statusDot.className = 'status-dot active';
                
                detectionInterval = setInterval(() => {
                    // Simulate dart detection
                    const dartCount = Math.floor(Math.random() * 3);
                    document.getElementById('dartCount').textContent = dartCount;
                }, 2000);
            }
        }
        
        function refreshFeed() {
            const videoFeed = document.getElementById('videoFeed');
            const currentSrc = videoFeed.src;
            videoFeed.src = '';
            setTimeout(() => {
                videoFeed.src = currentSrc;
            }, 100);
        }
        
        // Initialize camera status
        document.addEventListener('DOMContentLoaded', function() {
            // Test camera connection
            fetch('/api/camera/stream?test=true')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'mock_mode') {
                        document.getElementById('cameraStatus').className = 'status-dot active';
                        console.log('Camera feed in mock mode');
                    }
                })
                .catch(error => {
                    console.error('Camera test failed:', error);
                    document.getElementById('cameraStatus').className = 'status-dot inactive';
                });
        });
    </script>
</body>
</html>
