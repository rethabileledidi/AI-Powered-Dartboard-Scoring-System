<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Dartboard Background -->
  <circle cx="200" cy="200" r="190" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="180" fill="#e2e8f0" stroke="#1a202c" stroke-width="1"/>
  <circle cx="200" cy="200" r="170" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Double Ring -->
  <circle cx="200" cy="200" r="160" fill="#e2e8f0" stroke="#1a202c" stroke-width="1"/>
  <circle cx="200" cy="200" r="150" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Main Scoring Area -->
  <circle cx="200" cy="200" r="140" fill="#e2e8f0" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Triple Ring -->
  <circle cx="200" cy="200" r="100" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  <circle cx="200" cy="200" r="90" fill="#e2e8f0" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Inner Area -->
  <circle cx="200" cy="200" r="50" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Bullseye -->
  <circle cx="200" cy="200" r="15" fill="#22c55e" stroke="#1a202c" stroke-width="1"/>
  <circle cx="200" cy="200" r="8" fill="#ef4444" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Section Lines -->
  <g stroke="#1a202c" stroke-width="1" fill="none">
    <line x1="200" y1="10" x2="200" y2="390"/>
    <line x1="10" y1="200" x2="390" y2="200"/>
    <line x1="59" y1="59" x2="341" y2="341"/>
    <line x1="341" y1="59" x2="59" y2="341"/>
  </g>
  
  <!-- Sample Dart Positions -->
  <!-- Dart 1: Triple 20 -->
  <g>
    <circle cx="200" cy="70" r="8" fill="#ef4444" stroke="#1a202c" stroke-width="2"/>
    <line x1="200" y1="62" x2="200" y2="50" stroke="#1a202c" stroke-width="2"/>
    <text x="200" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="#1a202c" font-weight="bold">T20</text>
  </g>
  
  <!-- Dart 2: Double 16 -->
  <g>
    <circle cx="280" cy="120" r="8" fill="#3b82f6" stroke="#1a202c" stroke-width="2"/>
    <line x1="288" y1="120" x2="300" y2="120" stroke="#1a202c" stroke-width="2"/>
    <text x="305" y="125" text-anchor="start" font-family="Arial" font-size="10" fill="#1a202c" font-weight="bold">D16</text>
  </g>
  
  <!-- Dart 3: Single Bull -->
  <g>
    <circle cx="200" cy="200" r="6" fill="#22c55e" stroke="#1a202c" stroke-width="2"/>
    <text x="220" y="205" text-anchor="start" font-family="Arial" font-size="10" fill="#1a202c" font-weight="bold">BULL</text>
  </g>
  
  <!-- Dart 4: Outer Single -->
  <g>
    <circle cx="150" cy="280" r="8" fill="#f59e0b" stroke="#1a202c" stroke-width="2"/>
    <text x="130" y="285" text-anchor="end" font-family="Arial" font-size="10" fill="#1a202c" font-weight="bold">S11</text>
  </g>
  
  <!-- Detection Visualization -->
  <g fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2">
    <circle cx="200" cy="70" r="15"/>
    <circle cx="280" cy="120" r="15"/>
    <circle cx="200" cy="200" r="12"/>
    <circle cx="150" cy="280" r="15"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#1a202c" font-weight="bold">Sample Dart Positions</text>
  
  <!-- Legend -->
  <g transform="translate(20, 350)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#1a202c">Legend:</text>
    <circle cx="50" cy="-3" r="4" fill="#ef4444"/>
    <text x="60" y="0" font-family="Arial" font-size="9" fill="#1a202c">Triple</text>
    <circle cx="100" cy="-3" r="4" fill="#3b82f6"/>
    <text x="110" y="0" font-family="Arial" font-size="9" fill="#1a202c">Double</text>
    <circle cx="150" cy="-3" r="4" fill="#22c55e"/>
    <text x="160" y="0" font-family="Arial" font-size="9" fill="#1a202c">Bull</text>
    <circle cx="190" cy="-3" r="4" fill="#f59e0b"/>
    <text x="200" y="0" font-family="Arial" font-size="9" fill="#1a202c">Single</text>
  </g>
</svg>